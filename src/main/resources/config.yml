# Ticks between flight checks
check-delay: 5

# Time in seconds of slow falling when auto disabling
# 0 disables the function
slowfalling-time: 5

# Whether to enable the slow falling when manually disabling claimfly
manual-slowfalling: false

enable-griefprevention: true
enable-plotsquared: true

string-enabled: "Claimfly enabled!"
string-disabled: "Claimfly disabled!"
string-auto-disabled: "Claimfly disabled!"
string-no-permission: "You can only claimfly in claims you own or are trusted in!"
string-already-off: "Claimfly already disabled"
string-already-flying: "You are already flying from another source!"